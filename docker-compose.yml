version: '3.8'

services:
  # Servicio de la API FastAPI
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # Expone al huésped en el 8080
    environment:
      # Conecta con postgres utilizando el nombre del servicio "db" como host
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/mydb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_estudiantes # Red personalizada
    restart: unless-stopped

  # Servicio de la Base de Datos
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - volumen_estudiantes_db:/var/lib/postgresql/data # Volumen persistente
    networks:
      - red_estudiantes # Misma red para comunicarse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

# Definición de red personalizada
networks:
  red_estudiantes:
    driver: bridge

# Definición de volumen con nombre personalizado
volumes:
  volumen_estudiantes_db:
    name: volumen_estudiantes_db